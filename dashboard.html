<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Farmer Dashboard</title>

<script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
<script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular-animate.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
display:flex;
background:#f4fff4;
}

/* Sidebar */

.sidebar{
width:250px;
height:100vh;
background:#2e7d32;
padding-top:20px;
position:fixed;
}

.sidebar h2{
color:white;
text-align:center;
margin-bottom:30px;
}

.sidebar a{
display:block;
padding:15px 25px;
color:white;
text-decoration:none;
font-size:16px;
}

.sidebar a:hover{
background:#1b5e20;
}

/* Main Content */

.main{
margin-left:250px;
padding:30px;
width:100%;
}

.main h1{
color:#2e7d32;
margin-bottom:20px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.card{
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.card h3{
color:#2e7d32;
margin-bottom:10px;
}

/* Dashboard entrance animation */

.animated-card {
    animation: cardAppear 1.2s ease-out forwards;
    opacity: 0;
}

/* Each card appears after a small delay */

.animated-card:nth-child(1) {
    animation-delay: 0.2s;
}

.animated-card:nth-child(2) {
    animation-delay: 0.5s;
}

.animated-card:nth-child(3) {
    animation-delay: 0.8s;
}

.animated-card:nth-child(4) {
    animation-delay: 1.1s;
}

@keyframes cardAppear {

    0% {
        opacity: 0;
        transform: translateY(80px) scale(0.7);
    }

    60% {
        opacity: 1;
        transform: translateY(-10px) scale(1.05);
    }

    100% {
        opacity: 1;
        transform: translateY(0) scale(1);
    }

}
</style>
</head>

<body ng-app="agriApp">

<div class="sidebar">

<h2>🌱 AgriAssist AI</h2>

<a href="dashboard.html">🏠 Dashboard</a>
<a href="profile.html">👤 My Profile</a>
<a href="farms.html">🚜 My Farms</a>
<a href="addfarm.html">➕ Add Farm</a>
<a href="fertilizer.html">🌱 Fertilizer Calculator</a>
<a href="disease.html">🌿 Disease Detection</a>
<a href="pest.html">🐛 Pest Detection</a>
<a href="weather.html">☁ Weather Advice</a>
<a href="assistant.html">🤖 AI Assistant</a>
<a href="login.html">🚪 Logout</a>

</div>

<div class="main">

<h1>Welcome Farmer 👋</h1>
<div class="cards" ng-controller="DashboardController">

    <div class="card animated-card" ng-repeat="card in cards">

        <h3>{{card.title}}</h3>

        <p>{{card.description}}</p>

    </div>

</div>

</div>

<script>

var app = angular.module("agriApp", ["ngAnimate"]);

app.controller("DashboardController", function($scope) {

    $scope.cards = [
        {
            title: "Total Farms",
            description: "3 Registered Farms"
        },
        {
            title: "Disease Reports",
            description: "2 Pending Analyses"
        },
        {
            title: "Weather",
            description: "Sunny • 30°C"
        },
        {
            title: "AI Assistant",
            description: "Ready to Answer Questions"
        }
    ];

});

</script>

</body>
</html>
