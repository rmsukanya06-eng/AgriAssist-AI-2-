<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - AgriAssist AI</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

:root{
--primary:#2e7d32;
--light:#f4fff4;
}

body{
background:var(--light);
min-height:100vh;
}

/* Navbar */

header{
background:var(--primary);
padding:15px 8%;
}

nav{
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
color:white;
font-size:28px;
font-weight:bold;
}

.nav-links{
display:flex;
list-style:none;
gap:25px;
}

.nav-links a{
text-decoration:none;
color:white;
font-weight:600;
}

.nav-links a:hover{
color:#ffeb3b;
}

/* Login Section */

.container{
display:flex;
justify-content:center;
align-items:center;
padding:60px 20px;
}

.login-card{
background:white;
width:420px;
padding:35px;
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,.1);
}

.login-card h1{
text-align:center;
color:#1b5e20;
margin-bottom:10px;
}

.login-card p{
text-align:center;
color:#666;
margin-bottom:25px;
}

/* Role Selection */

.role-section{
margin-bottom:20px;
}

.role-title{
display:block;
margin-bottom:10px;
font-weight:600;
}

.role-options{
display:flex;
gap:10px;
}

.role-option{
flex:1;
padding:12px;
border:2px solid #ddd;
border-radius:10px;
text-align:center;
cursor:pointer;
font-weight:600;
transition:0.3s;
}

.role-option:hover{
border-color:#2e7d32;
background:#f1f8f1;
}

.role-option.active{
border-color:#2e7d32;
background:#e8f5e9;
color:#1b5e20;
}

/* Form */

.form-group{
margin-bottom:18px;
}

label{
display:block;
margin-bottom:8px;
font-weight:600;
}

input{
width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:8px;
outline:none;
}

input:focus{
border-color:#2e7d32;
}

/* Button */

button{
width:100%;
padding:12px;
background:var(--primary);
color:white;
border:none;
border-radius:8px;
cursor:pointer;
font-size:16px;
}

button:hover{
background:#1b5e20;
}

/* Links */

.links{
text-align:center;
margin-top:15px;
}

.links a{
text-decoration:none;
color:var(--primary);
font-weight:600;
display:block;
margin-top:8px;
}

/* Login information */

.login-info{
margin-top:20px;
padding:12px;
background:#f1f8f1;
border-radius:8px;
font-size:13px;
color:#555;
text-align:center;
}

.login-info strong{
color:#2e7d32;
}

/* Footer */

footer{
background:var(--primary);
color:white;
text-align:center;
padding:20px;
margin-top:40px;
}

@media(max-width:768px){

nav{
flex-direction:column;
gap:15px;
}

.nav-links{
flex-wrap:wrap;
justify-content:center;
}

.login-card{
width:100%;
}

}

</style>
</head>

<body>

<!-- ================= NAVBAR ================= -->

<header>

<nav>

<div class="logo">
🌱 AgriAssist AI
</div>

<ul class="nav-links">

<li>
<a href="landing.html">Home</a>
</li>

<li>
<a href="about.html">About Us</a>
</li>

<li>
<a href="contact.html">Contact</a>
</li>

<li>
<a href="register.html">Register</a>
</li>

</ul>

</nav>

</header>


<!-- ================= LOGIN ================= -->

<div class="container">

<div class="login-card">

<h1>Login</h1>

<p>Access your AgriAssist AI account</p>


<form id="loginForm">


<!-- ROLE SELECTION -->

<div class="role-section">

<span class="role-title">
Login As
</span>

<div class="role-options">

<div
class="role-option active"
id="farmerRole"
onclick="selectRole('farmer')">

👨‍🌾 Farmer

</div>

<div
class="role-option"
id="adminRole"
onclick="selectRole('admin')">

👨‍💼 Admin

</div>

</div>

</div>


<!-- USERNAME -->

<div class="form-group">

<label>
Email / Username
</label>

<input
type="text"
id="username"
placeholder="Enter your username"
required>

</div>


<!-- PASSWORD -->

<div class="form-group">

<label>
Password
</label>

<input
type="password"
id="password"
placeholder="Enter your password"
required>

</div>


<!-- LOGIN BUTTON -->

<button type="submit">

Login

</button>


<!-- LINKS -->

<div class="links">

<a href="forgot.html">
Forgot Password?
</a>

<a href="register.html">
Create New Account
</a>

</div>


<!-- LOGIN INFO -->

<div class="login-info">

Currently logging in as:
<strong id="selectedRole">
Farmer
</strong>

</div>


</form>

</div>

</div>


<!-- ================= FOOTER ================= -->

<footer>

<h3>AgriAssist AI</h3>

<p>
Smart Farming • Better Future
</p>

</footer>


<script>

let selectedRole = "farmer";

function selectRole(role) {
    selectedRole = role;

    document.getElementById("farmerRole").classList.toggle("active", role === "farmer");
    document.getElementById("adminRole").classList.toggle("active", role === "admin");
    document.getElementById("selectedRole").innerText = role === "farmer" ? "Farmer" : "Admin";
}

document.getElementById("loginForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;

    if (!username || !password) {
        alert("❌ Please fill all fields");
        return;
    }

if (selectedRole === "admin") {

    try {

        const response = await fetch("/api/admin/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                username,
                password
            })
        });

        const data = await response.json();

        if (response.ok) {

            localStorage.setItem("userRole", "admin");
            localStorage.setItem("username", data.admin.username);
            localStorage.setItem("adminId", data.admin.id);
            localStorage.setItem("adminName", data.admin.name);
            localStorage.setItem("adminEmail", data.admin.email);

            alert("✅ Admin Login Successful!");

            window.location.href = "admin.html";

        } else {

            alert("❌ " + data.message);

        }

    } catch (error) {

        console.error("Admin login error:", error);

        alert("❌ Cannot connect to server. Make sure Node.js is running.");

    }

    return;
}

    try {
        const response = await fetch("/api/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (response.ok) {
            localStorage.setItem("userRole", "farmer");
            localStorage.setItem("username", data.user.username);
            localStorage.setItem("userId", data.user.id);
            localStorage.setItem("userEmail", data.user.email);
            localStorage.setItem("userName", data.user.name);

            alert("✅ Farmer Login Successful!");
            window.location.href = "dashboard.html";
        } else {
            alert("❌ " + data.message);
        }
    } catch (error) {
        console.error(error);
        alert("❌ Cannot connect to server. Make sure Node.js is running.");
    }
});

</script>

</body>
</html>
